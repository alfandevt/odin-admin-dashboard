<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div id="root">
      <header class="main-header">
        <div class="search-bar">
          <img
            src="assets/header-icons/magnify.svg"
            alt="Search"
            class="search-icon"
          />
          <input class="search-bar-input" placeholder="search..." type="text" />
        </div>
        <div class="greet-info">
          <img
            class="greet-user-img"
            src="assets/shared-icons/account.svg"
            alt="User"
          />
          <p class="greet-user-text">
            Hi there, <br />
            <span class="greet-user-name">Morgan Oakley (@morgan)</span>
          </p>
        </div>
        <div class="user-profile">
          <img
            src="assets/header-icons/bell-ring-outline.svg"
            alt="Notification"
            class="user-notification"
          />
          <div class="user-profile-action">
            <img
              src="assets/shared-icons/account.svg"
              alt="User Account"
              class="user-acc-img"
            />
            <span class="user-profile-name">Morgan Oakley</span>
          </div>
        </div>
        <div class="actions-group">
          <button class="btn-actions">New</button>
          <button class="btn-actions">Upload</button>
          <button class="btn-actions">Share</button>
        </div>
      </header>
      <aside class="sidebar">
        <a href="#" class="brand">
          <img src="assets/sidebar-icons/view-dashboard.svg" alt="Dashboard" />
          <span>Dashboard</span>
        </a>

        <nav class="nav-menu">
          <a href="#" class="nav-link">
            <img src="assets/sidebar-icons/home.svg" alt="Home" />
            <span>Home</span>
          </a>
          <a href="#" class="nav-link">
            <img
              src="assets/sidebar-icons/card-account-details-outline.svg"
              alt="Profile"
            />
            <span>Profile</span>
          </a>
          <a href="#" class="nav-link">
            <img src="assets/sidebar-icons/message-reply.svg" alt="Messages" />
            <span>Messages</span>
          </a>
          <a href="#" class="nav-link">
            <img
              src="assets/sidebar-icons/clock-time-three.svg"
              alt="History"
            />
            <span>History</span>
          </a>
          <a href="#" class="nav-link">
            <img src="assets/sidebar-icons/note-multiple.svg" alt="Tasks" />
            <span>Tasks</span>
          </a>
          <a href="#" class="nav-link">
            <img src="assets/sidebar-icons/account-group.svg" alt="Community" />
            <span>Community</span>
          </a>
        </nav>

        <nav class="nav-settings">
          <a href="#" class="nav-link">
            <img src="assets/sidebar-icons/cog.svg" alt="Settings" />
            <span>Settings</span>
          </a>
          <a href="#" class="nav-link">
            <img src="assets/sidebar-icons/help-box.svg" alt="Support" />
            <span>Support</span>
          </a>
          <a href="#" class="nav-link">
            <img src="assets/sidebar-icons/shield-check.svg" alt="Privacy" />
            <span>Privacy</span>
          </a>
        </nav>
      </aside>
      <main></main>
    </div>
  </body>
</html>
